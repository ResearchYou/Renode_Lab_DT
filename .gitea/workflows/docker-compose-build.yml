name: docker-compose-build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  compose-build:
    runs-on: debian-latest
    steps:
      - name: Preflight runner info
        run: |
          uname -a || true
          id || true
          pwd
          ls -la

      - name: Check docker and compose
        run: |
          command -v docker
          docker version
          docker compose version

      - name: Build in current workspace
        run: |
          test -f docker-compose.yml
          docker compose build
