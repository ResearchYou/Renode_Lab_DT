name: docker-compose-build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: sh

jobs:
  compose-build:
    runs-on: debian-latest
    steps:
      - name: Ensure Node runtime for JS actions
        run: |
          set -eu

          if command -v node >/dev/null 2>&1; then
            node --version
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          elif [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            echo "Node is missing and no root/sudo is available to install it."
            exit 1
          fi

          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends nodejs npm ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf -y install nodejs ca-certificates
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache nodejs npm ca-certificates
          else
            echo "Unsupported package manager; install Node.js on the runner image."
            exit 1
          fi

          node --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Docker + Compose availability
        run: |
          set -eu

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not available on this runner."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is not available on this runner."
            exit 1
          fi

          docker version
          docker compose version

      - name: Build all compose services
        run: |
          set -eu
          docker compose build
