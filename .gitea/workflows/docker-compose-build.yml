name: docker-compose-build

on:
  push:
    branches:
      - master
      - master-restructure
      - dev/*
  workflow_dispatch:

jobs:
  compose-build:
    runs-on: debian-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - name: Install required tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl docker.io
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

      - name: Resolve source directory (Node-free)
        run: |
          set -eu

          REPO_FULL="${GITHUB_REPOSITORY:-${GITEA_REPOSITORY:-cez/Renode_DT}}"
          REPO_NAME="${REPO_FULL##*/}"
          SOURCE_DIR=""

          for CANDIDATE in "$PWD" "${GITHUB_WORKSPACE:-}" "${GITEA_WORKSPACE:-}" "$PWD/$REPO_NAME" "/workspace/$REPO_NAME" "/__w/$REPO_NAME/$REPO_NAME"; do
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/docker-compose.yml" ]; then
              SOURCE_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SOURCE_DIR" ]; then
            FOUND="$(find /workspace /__w . -maxdepth 6 -type f -name docker-compose.yml 2>/dev/null | head -n1 || true)"
            if [ -n "$FOUND" ]; then
              SOURCE_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$SOURCE_DIR" ]; then
            echo "--- debug env ---"
            echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}"
            echo "GITEA_REPOSITORY=${GITEA_REPOSITORY:-}"
            echo "GITHUB_SERVER_URL=${GITHUB_SERVER_URL:-}"
            echo "GITEA_SERVER_URL=${GITEA_SERVER_URL:-}"
            echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-}"
            echo "GITEA_REF_NAME=${GITEA_REF_NAME:-}"
            echo "GITHUB_SHA=${GITHUB_SHA:-}"
            echo "GITEA_TOKEN set=$([ -n "${GITEA_TOKEN:-}" ] && echo yes || echo no)"
            echo "-----------------"

            if [ -z "${GITEA_TOKEN:-}" ]; then
              echo "Source not found and GITEA_TOKEN is unavailable for fallback download."
              exit 1
            fi

            SERVER_URL="${GITHUB_SERVER_URL:-${GITEA_SERVER_URL:-https://gitea.cyb3rhell.com}}"
            SHA="${GITHUB_SHA:-}"
            if [ -z "$SHA" ]; then
              echo "GITHUB_SHA is empty, cannot build archive URL."
              exit 1
            fi
            ARCHIVE_URL="$SERVER_URL/api/v1/repos/$REPO_FULL/archive/$SHA.tar.gz"
            echo "Downloading archive: $ARCHIVE_URL"

            SOURCE_DIR="$PWD/repo-src"
            rm -rf "$SOURCE_DIR"
            mkdir -p "$SOURCE_DIR"
            curl -fsSL -H "Authorization: token $GITEA_TOKEN" "$ARCHIVE_URL" \
              | tar -xz -C "$SOURCE_DIR" --strip-components=1
          fi

          test -f "$SOURCE_DIR/docker-compose.yml"
          printf '%s\n' "$SOURCE_DIR" > .source-dir
          echo "Using source dir: $SOURCE_DIR"
          ls -la "$SOURCE_DIR"

      - name: Ensure Docker + Compose availability
        run: |
          set -eu
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          echo "socket: $(ls -la /var/run/docker.sock 2>/dev/null || echo not found)"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker CLI is not available on this runner."
            exit 1
          fi

          if ! docker version; then
            echo "Docker daemon is not reachable."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is not available on this runner."
            exit 1
          fi

          docker compose version

      - name: Build all compose services
        run: |
          set -eu
          SOURCE_DIR="$(cat .source-dir)"
          cd "$SOURCE_DIR"
          docker compose build

      - name: Sanity check - code-server and Renode
        run: |
          set -eu
          SOURCE_DIR="$(cat .source-dir)"
          cd "$SOURCE_DIR"

          cleanup() {
            echo "--- cleanup ---"
            docker compose down --remove-orphans || true
          }
          trap cleanup EXIT

          # Start IDE in detached mode
          docker compose up -d ide

          # Poll until nginx/code-server responds on the exposed port
          echo "Waiting for code-server on :8443..."
          CODE_SERVER_UP=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8443 >/dev/null 2>&1; then
              CODE_SERVER_UP=true
              break
            fi
            sleep 2
          done

          if [ "$CODE_SERVER_UP" = "false" ]; then
            echo "[FAIL] code-server did not respond on :8443 after 60s"
            docker compose logs ide
            exit 1
          fi
          echo "[PASS] code-server is listening on :8443"

          # Run digital-twin one-shot: builds firmware and runs Renode test
          echo "Running Renode digital-twin test..."
          docker compose run --rm digital-twin
          echo "[PASS] Renode test completed successfully"
