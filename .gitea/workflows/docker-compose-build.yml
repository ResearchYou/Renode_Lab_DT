name: docker-compose-build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: sh

jobs:
  compose-build:
    runs-on: debian-latest
    steps:
      - name: Locate repository workspace (Node-free)
        run: |
          set -eu

          REPO_FULL="${GITHUB_REPOSITORY:-${GITEA_REPOSITORY:-}}"
          REPO_NAME="${REPO_FULL##*/}"
          if [ -z "$REPO_NAME" ] || [ "$REPO_NAME" = "$REPO_FULL" ]; then
            REPO_NAME="Renode_DT"
          fi

          WORKSPACE=""
          for CANDIDATE in "${GITHUB_WORKSPACE:-}" "${GITEA_WORKSPACE:-}" "$PWD" "$PWD/$REPO_NAME" "/workspace/$REPO_NAME" "/__w/$REPO_NAME/$REPO_NAME"; do
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/docker-compose.yml" ]; then
              WORKSPACE="$CANDIDATE"
              break
            fi
          done

          if [ -z "$WORKSPACE" ]; then
            FOUND_COMPOSE="$(find . -maxdepth 5 -type f -name docker-compose.yml | head -n1 || true)"
            if [ -n "$FOUND_COMPOSE" ]; then
              WORKSPACE="$(dirname "$FOUND_COMPOSE")"
            fi
          fi

          if [ -z "$WORKSPACE" ]; then
            echo "Could not locate docker-compose.yml in runner workspace."
            exit 1
          fi

          echo "Using workspace: $WORKSPACE"
          ls -la "$WORKSPACE"

      - name: Ensure Docker + Compose availability
        run: |
          set -eu

          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "Docker and Compose already available"
            docker version
            docker compose version
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          elif [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            echo "Docker Compose is missing and no root/sudo is available to install it."
            exit 1
          fi

          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends docker.io docker-compose-v2 ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf -y install docker docker-compose-plugin ca-certificates
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache docker-cli docker-cli-compose ca-certificates
          else
            echo "Unsupported package manager; install Docker and Docker Compose on the runner manually."
            exit 1
          fi

          docker version
          docker compose version

      - name: Build all compose services
        run: |
          set -eu
          REPO_FULL="${GITHUB_REPOSITORY:-${GITEA_REPOSITORY:-}}"
          REPO_NAME="${REPO_FULL##*/}"
          if [ -z "$REPO_NAME" ] || [ "$REPO_NAME" = "$REPO_FULL" ]; then
            REPO_NAME="Renode_DT"
          fi

          WORKSPACE=""
          for CANDIDATE in "${GITHUB_WORKSPACE:-}" "${GITEA_WORKSPACE:-}" "$PWD" "$PWD/$REPO_NAME" "/workspace/$REPO_NAME" "/__w/$REPO_NAME/$REPO_NAME"; do
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/docker-compose.yml" ]; then
              WORKSPACE="$CANDIDATE"
              break
            fi
          done

          if [ -z "$WORKSPACE" ]; then
            FOUND_COMPOSE="$(find . -maxdepth 5 -type f -name docker-compose.yml | head -n1 || true)"
            if [ -n "$FOUND_COMPOSE" ]; then
              WORKSPACE="$(dirname "$FOUND_COMPOSE")"
            fi
          fi

          if [ -z "$WORKSPACE" ]; then
            echo "Could not locate docker-compose.yml for build step."
            exit 1
          fi

          cd "$WORKSPACE"
          docker compose build
