name: docker-compose-build

on:
  push:
    branches:
      - master
      - master-restructure
  workflow_dispatch:

jobs:
  compose-build:
    runs-on: debian-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - name: Resolve source directory (Node-free)
        run: |
          set -eu

          REPO_FULL="${GITHUB_REPOSITORY:-${GITEA_REPOSITORY:-cez/Renode_DT}}"
          REPO_NAME="${REPO_FULL##*/}"
          SOURCE_DIR=""

          for CANDIDATE in "$PWD" "${GITHUB_WORKSPACE:-}" "${GITEA_WORKSPACE:-}" "$PWD/$REPO_NAME" "/workspace/$REPO_NAME" "/__w/$REPO_NAME/$REPO_NAME"; do
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/docker-compose.yml" ]; then
              SOURCE_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SOURCE_DIR" ]; then
            FOUND="$(find /workspace /__w . -maxdepth 6 -type f -name docker-compose.yml 2>/dev/null | head -n1 || true)"
            if [ -n "$FOUND" ]; then
              SOURCE_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$SOURCE_DIR" ]; then
            if ! command -v git >/dev/null 2>&1; then
              echo "Source not found and git is unavailable for fallback clone."
              exit 1
            fi
            if [ -z "${GITEA_TOKEN:-}" ]; then
              echo "Source not found and GITEA_TOKEN is unavailable for fallback clone."
              exit 1
            fi
            SERVER_URL="${GITHUB_SERVER_URL:-${GITEA_SERVER_URL:-https://gitea.cyb3rhell.com}}"
            CLONE_URL="$(printf '%s' "$SERVER_URL" | sed 's#://#://x-access-token:'"$GITEA_TOKEN"'@#')/$REPO_FULL.git"
            REF_BRANCH="${GITHUB_REF_NAME:-${GITEA_REF_NAME:-master}}"
            SOURCE_DIR="$PWD/repo-src"
            rm -rf "$SOURCE_DIR"
            git clone --depth 1 --branch "$REF_BRANCH" "$CLONE_URL" "$SOURCE_DIR"
          fi

          test -f "$SOURCE_DIR/docker-compose.yml"
          printf '%s\n' "$SOURCE_DIR" > .source-dir
          echo "Using source dir: $SOURCE_DIR"
          ls -la "$SOURCE_DIR"

      - name: Ensure Docker + Compose availability
        run: |
          set -eu

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not available on this runner."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is not available on this runner."
            exit 1
          fi

          docker version
          docker compose version

      - name: Build all compose services
        run: |
          set -eu
          SOURCE_DIR="$(cat .source-dir)"
          cd "$SOURCE_DIR"
          docker compose build
