name: docker-compose-build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  compose-build:
    runs-on: debian-latest
    steps:
      - name: Preflight runner info
        run: |
          set -eu
          uname -a || true
          id || true
          pwd
          ls -la

      - name: Check docker and compose
        run: |
          set -eu
          command -v docker
          docker version
          docker compose version

      - name: Resolve source directory
        run: |
          set -eu
          REPO_FULL="${GITHUB_REPOSITORY:-${GITEA_REPOSITORY:-cez/Renode_DT}}"
          REPO_NAME="${REPO_FULL##*/}"
          SOURCE_DIR=""

          for CANDIDATE in "$PWD" "${GITHUB_WORKSPACE:-}" "${GITEA_WORKSPACE:-}" "$PWD/$REPO_NAME" "/workspace/$REPO_NAME" "/__w/$REPO_NAME/$REPO_NAME"; do
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/docker-compose.yml" ]; then
              SOURCE_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SOURCE_DIR" ]; then
            FOUND="$(find . -maxdepth 6 -type f -name docker-compose.yml | head -n1 || true)"
            if [ -n "$FOUND" ]; then
              SOURCE_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$SOURCE_DIR" ]; then
            if ! command -v git >/dev/null 2>&1; then
              echo "docker-compose.yml not found and git is unavailable for fallback clone."
              exit 1
            fi
            if [ -z "${GITEA_TOKEN:-}" ]; then
              echo "docker-compose.yml not found and GITEA_TOKEN is unavailable for fallback clone."
              exit 1
            fi
            SERVER_URL="${GITHUB_SERVER_URL:-${GITEA_SERVER_URL:-https://gitea.cyb3rhell.com}}"
            CLONE_URL="$(printf '%s' "$SERVER_URL" | sed 's#://#://x-access-token:'"$GITEA_TOKEN"'@#')/$REPO_FULL.git"
            SOURCE_DIR="$PWD/repo-src"
            rm -rf "$SOURCE_DIR"
            git clone --depth 1 "$CLONE_URL" "$SOURCE_DIR"
          fi

          test -f "$SOURCE_DIR/docker-compose.yml"
          printf '%s\n' "$SOURCE_DIR" > .source-dir
          echo "Using source dir: $SOURCE_DIR"
          ls -la "$SOURCE_DIR"

      - name: Build compose services
        run: |
          set -eu
          SOURCE_DIR="$(cat .source-dir)"
          cd "$SOURCE_DIR"
          docker compose build
