services:
  spi-twin:
    image: spi-twin-test
    build:
      context: .
      dockerfile: docker/Dockerfile.spi
      network: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: stm32-spi-twin
    security_opt:
      - label:disable
    volumes:
      - ./firmware:/workspace/firmware:ro,z
      - ./renode:/workspace/renode:ro,z
      - ./output:/workspace/output:z
      - ./build:/workspace/build:z
    entrypoint: ["/bin/bash", "-c", "/workspace/scripts/build_spi_firmware.sh && /workspace/scripts/run_spi_test.sh"]

  ide:
    build:
      context: .
      dockerfile: docker/Dockerfile.ide
      network: host
    container_name: challenge-ide
    security_opt:
      - label:disable
    ports:
      - "8443:8080"
    environment:
      - "HOST_PROJECT_DIR=${PWD}"
      - "RUNNER_SERVICE=spi-twin"
    volumes:
      - ./firmware:/home/coder/challenge/firmware:z
      - ./ide/problem:/home/coder/challenge/problem:z
      - ./output:/home/coder/challenge/output:z
      - ./docker-compose.yml:/home/coder/docker-compose.yml:ro,z
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
