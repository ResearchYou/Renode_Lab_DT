services:
  digital-twin:
    image: renode_dt-digital-twin:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    environment:
      TAG_COUNT: "${TAG_COUNT:-12}"
      GATEWAY_COUNT: "${GATEWAY_COUNT:-3}"
      ATTACKER_COUNT: "${ATTACKER_COUNT:-2}"
      SECTOR_INDEX: "${SECTOR_INDEX:-0}"
      SIMULATION_SECONDS: "${SIMULATION_SECONDS:-8}"
    userns_mode: host
    security_opt:
      - label:disable
    volumes:
      - challenge-firmware:/workspace/firmware:ro
      - challenge-output:/workspace/output

  ide:
    image: renode_dt-ide:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.ide
      network: host
    userns_mode: host
    security_opt:
      - label:disable
    ports:
      - "${IDE_PORT:-8443}:8080"
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-renode_dt}"
      RUNNER_SERVICE: digital-twin
    volumes:
      - challenge-firmware:/home/coder/challenge/firmware
      - challenge-problem:/home/coder/challenge/problem
      - challenge-output:/home/coder/challenge/output
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"

volumes:
  challenge-firmware:
  challenge-problem:
  challenge-output:
