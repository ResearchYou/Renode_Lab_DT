services:
  digital-twin:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: rp2040-digital-twin
    userns_mode: host
    security_opt:
      - label:disable
    volumes:
      - ./firmware:/workspace/firmware:ro,z
      - ./renode:/workspace/renode:ro,z
      - ./docker/scripts/entrypoint.sh:/workspace/scripts/entrypoint.sh:ro,z
      - ./docker/scripts/build_firmware.sh:/workspace/scripts/build_firmware.sh:ro,z
      - ./docker/scripts/run_test.sh:/workspace/scripts/run_test.sh:ro,z
      - ./docker/scripts/generate_report.py:/workspace/scripts/generate_report.py:ro,z
      - ./output:/workspace/output:z
    entrypoint: ["/bin/bash", "/workspace/scripts/entrypoint.sh"]

  digital-twin-metrics:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: rp2040-digital-twin-metrics
    userns_mode: host
    security_opt:
      - label:disable
    volumes:
      - ./firmware:/workspace/firmware:ro,z
      - ./renode:/workspace/renode:ro,z
      - ./docker/scripts/build_firmware.sh:/workspace/scripts/build_firmware.sh:ro,z
      - ./docker/scripts/run_metrics.sh:/workspace/scripts/run_metrics.sh:ro,z
      - ./output:/workspace/output:z
    entrypoint: ["/bin/bash", "-c", "/workspace/scripts/build_firmware.sh && /workspace/scripts/run_metrics.sh"]
    profiles:
      - metrics

  ide:
    build:
      context: .
      dockerfile: docker/Dockerfile.ide
      network: host
    container_name: challenge-ide
    userns_mode: host
    security_opt:
      - label:disable
    ports:
      - "8443:8080"
    environment:
      - "HOST_PROJECT_DIR=${HOST_PROJECT_DIR}"
      - "RUNNER_SERVICE=digital-twin"
    volumes:
      - ./firmware:/home/coder/challenge/firmware:z
      - ./ide/problem:/home/coder/challenge/problem:z
      - ./output:/home/coder/challenge/output:z
      - ./docker-compose.yml:/home/coder/docker-compose.yml:ro,z
      # The nested Docker Compose client runs inside the IDE container, so it
      # must be able to read the same project path it passes to the host daemon.
      - .:${HOST_PROJECT_DIR}:ro,z
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
