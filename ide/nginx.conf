user root;
worker_processes 1;
error_log  /tmp/nginx_error.log;
pid        /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable temp dirs for non-root user
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path        /tmp/nginx_proxy;
    fastcgi_temp_path      /tmp/nginx_fastcgi;
    uwsgi_temp_path        /tmp/nginx_uwsgi;
    scgi_temp_path         /tmp/nginx_scgi;

    access_log /tmp/nginx_access.log;

    # Proper WebSocket upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }



    server {
        listen 8080;

        # Runner API (SSE — must not be buffered)
        location /api/ {
            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 600;
        }

        # Panel static assets (panel.js lives here)
        location /cp/ {
            alias /home/coder/panel/;
        }

        # Test results (report.html, UART logs, etc.)
        location /output/ {
            alias     /home/coder/challenge/output/;
            autoindex on;
        }

        # Task specification files
        location /spec/ {
            alias /home/coder/challenge/problem/;
        }

        # code-server — proxy everything else, inject panel script, strip CSP
        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade        $http_upgrade;
            proxy_set_header   Connection     $connection_upgrade;
            proxy_set_header   Host           $host;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # Force uncompressed HTML so sub_filter can reliably inject panel.js
            proxy_set_header   Accept-Encoding "";
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            proxy_socket_keepalive on;

            # Remove code-server CSP headers so injected script can execute
            proxy_hide_header  Content-Security-Policy;
            proxy_hide_header  Content-Security-Policy-Report-Only;

            # Ensure rewrite applies only to HTML responses
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter_last_modified off;

            # Inject panel script before </body> on all code-server HTML pages
            sub_filter '</body>' '<script src="/cp/panel.js"></script></body>';
        }
    }
}
